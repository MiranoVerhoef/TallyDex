name: Missing or incorrect card data
description: Report a missing card, printing, variant, set, logo, or incorrect catalog field.
title: "card data: "
labels:
  - card-data
body:
  - type: markdown
    attributes:
      value: |
        TallyDex uses TCGdex as its catalog source. Please search existing reports first and provide enough detail to verify the requested correction.
  - type: input
    id: set
    attributes:
      label: Set name and code
      placeholder: "Chaos Rising (CRI / me04)"
    validations:
      required: true
  - type: input
    id: card
    attributes:
      label: Card name and collector number
      placeholder: "Vulpix 008/122"
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What is missing or incorrect?
      options:
        - Entire card
        - Printing or variant
        - Set or series
        - Card image
        - Set logo or symbol
        - Card details
        - Other catalog data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Explain what TallyDex should show instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source or photo
      description: Link a reliable checklist or marketplace record, or attach a clear photo of the card.
    validations:
      required: true
